<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#D5D4CA;--panel:#E8E7DF;--panel2:#F3F2EC;--ink:#1F2536;--sub:#5B6173;--line:#B7B6AB;
 --hmi:#17223A;--hmi2:#1F2D4B;--hmiLine:#34466E;--wire:#6E7EA3;--hmiInk:#DDE6F7;
 --run:#1FC47F;--runGlow:rgba(31,196,127,.55);--stop:#E5484D;--amber:#F2A516;--heart:#F0609A;--cyan:#35C9E6;
 --shadow:0 2px 0 rgba(0,0,0,.08),0 8px 24px rgba(30,37,54,.12);
 --r-lg:22px;--r-md:14px;--r-sm:9px;
 --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
 --f-dot:"DotGothic16","Osaka-Mono","MS Gothic",ui-monospace,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172A;--panel:#1A2238;--panel2:#222C47;--ink:#E8ECF6;--sub:#9BA4BC;--line:#2F3A58;--hmi:#0C1426;--hmi2:#131E36;--hmiLine:#2A3A60;--shadow:0 2px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#10172A;--panel:#1A2238;--panel2:#222C47;--ink:#E8ECF6;--sub:#9BA4BC;--line:#2F3A58;--hmi:#0C1426;--hmi2:#131E36;--hmiLine:#2A3A60;--shadow:0 2px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;line-height:1.6;
 background-image:radial-gradient(circle at 1px 1px,rgba(120,120,110,.18) 1px,transparent 0);background-size:14px 14px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.dot{font-family:var(--f-dot)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.72em 1.2em;border-radius:999px;font-weight:800;font-size:15px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.go{background:var(--run);color:#06281A;box-shadow:0 3px 0 #10885A}
.btn.pk{background:var(--heart);color:#fff;box-shadow:0 3px 0 #B83A70}
.btn.am{background:var(--amber);color:#3A2600;box-shadow:0 3px 0 #B97A00}
.btn.sm{padding:.45em .85em;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);font-size:18px}
/* ---------- title ---------- */
.title{min-height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.title{--W:min(100vw,560px);--pt:7vh;--spH:85px}
.title .t-logo{padding-top:var(--pt)}
.title .t-menu{padding-bottom:16px}
.title .t-spon{position:relative;z-index:3;display:block;align-self:center;box-sizing:border-box;width:fit-content;max-width:100%;height:var(--spH);margin:2px 0 0;padding:6px 22px 8px;text-align:center;text-decoration:none;color:#1F2536;background:#fff;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.45),0 6px 18px rgba(40,20,70,.25);-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease;cursor:pointer}
.title .t-spon:hover{box-shadow:0 0 0 2px #fff,0 8px 22px rgba(40,20,70,.38)}
.title .t-spon:active{transform:scale(.97)}
.title .t-spon:focus-visible{outline:3px solid #35C9E6;outline-offset:3px}
.title .t-spon .tsl{display:block;font-size:9px;font-weight:800;letter-spacing:.26em;line-height:12px;color:#5B6173;margin-bottom:2px}
.title .t-spon .tsm{display:block;font-size:min(11.5px,3.45vw);font-weight:800;line-height:17px;letter-spacing:0;margin-bottom:5px;color:#1F2536}
.title .t-spon .tsm>span{display:block;white-space:nowrap}
.title .t-spon img{display:block;height:18px;width:auto;margin:0 auto}
.title .t-spon .tgo{position:absolute;top:7px;right:8px;width:11px;height:11px;color:#8A90A3}
@media (min-width:460px){.title{--spH:68px}.title .t-spon .tsm>span{display:inline}}
@media (min-height:760px) and (max-aspect-ratio:3/4){.title{--spH:112px}.title .t-spon{padding:9px 26px 12px}.title .t-spon .tsl{font-size:10px;line-height:14px;margin-bottom:4px}.title .t-spon .tsm{font-size:min(14px,3.5vw);line-height:21px;margin-bottom:7px}.title .t-spon img{height:24px}.title .t-spon .tgo{top:9px;right:10px;width:12px;height:12px}}
@media (min-height:760px) and (max-aspect-ratio:3/4) and (min-width:460px){.title{--spH:91px}}
@media (max-height:700px){.title{--pt:4.5vh}}
/* 立ち絵：スポンサー枠のぶん上げ、サブタイトルにかかる高さのときだけ幅を縮める（画面サイズだけで決まるので、開いた後に揺れない） */
.title .t-cast{left:50%;right:auto;bottom:calc(106px + var(--spH));width:clamp(60%,calc((100vh - 106px - var(--spH) - var(--pt) - 0.4219 * min(0.96 * (var(--W) - 48px), 460px) - 44.4px) * 1.2821),100%);transform:translateX(-50%)}
.t-sky{position:absolute;inset:0;background:linear-gradient(180deg,#FFB27A 0%,#F58CA8 38%,#6A6FC9 75%,#2A3160 100%);}
.t-sky svg.city{position:absolute;left:0;right:0;bottom:30%;width:100%;height:auto;opacity:.95}
.t-cast{position:absolute;left:0;right:0;bottom:104px;height:300px;z-index:2}
.t-cast .p{position:absolute;bottom:0;width:52%;filter:drop-shadow(0 6px 12px rgba(20,20,60,.35))}
.t-cast .p svg{width:100%;height:auto;display:block}
.t-cast .p1{left:-6%;width:50%;z-index:1}.t-cast .p2{left:25%;width:52%;z-index:2}.t-cast .p3{right:-6%;width:50%;z-index:1}
.t-logo{position:relative;z-index:3;padding:10vh 24px 0;text-align:center;color:#fff}
.t-logo h1{margin:0;font-size:clamp(56px,17vw,96px);line-height:1;font-weight:800;letter-spacing:.02em;text-shadow:0 4px 0 #C43D78,0 8px 24px rgba(80,20,60,.45)}
.t-logo .rungline{display:block;margin:14px auto 8px;width:min(320px,80%)}
.t-logo p{margin:0;font-size:15px;font-weight:700;opacity:.95}
.t-menu{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:18px 22px 26px;background:linear-gradient(0deg,rgba(20,24,52,.92),rgba(20,24,52,.0));display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn.opmv{display:block;text-align:center;text-decoration:none;background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.6);box-shadow:none;font-size:14px;padding:.55em 1em;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.btn.opmv .yt{display:inline-block;background:#FF3344;color:#fff;border-radius:6px;font-size:10px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.t-menu .mvrow{display:flex;gap:8px}.t-menu .mvrow .btn{flex:1;min-width:0;white-space:nowrap;padding-left:.3em;padding-right:.3em;font-size:13px;letter-spacing:0}.t-menu .mvrow .btn .yt{margin-right:3px;font-size:8px;padding:3px 5px}@media (max-width:350px){.t-menu .mvrow .btn{font-size:12px}.t-menu .mvrow .btn .yt{display:none}}
.edmv{display:flex;align-items:center;gap:12px;margin:10px 0 18px;position:relative;z-index:1;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,#2A2F6E,#141840);color:#fff;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}.edmv .yt{flex:none}.edmv b{display:block;font-size:15px}.edmv small{display:block;font-size:12px;color:#C9CBF0}
.t-menu .row{display:flex;gap:10px}.t-menu .row .btn{flex:1}
/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:2px solid var(--line)}
.hdr h2{margin:0;font-size:16px;flex:1;line-height:1.3;min-width:0}
.hdr h2 small{display:block;font-size:11px;color:var(--sub);font-weight:700}
/* ---------- select ---------- */
.sel{padding:12px 14px 40px}
.meter{display:flex;align-items:center;gap:10px;margin:4px 2px 16px;font-size:13px;color:var(--sub);font-weight:700}
.meter .bar{flex:1;height:10px;border-radius:5px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--run)}
.chap{margin-bottom:22px;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.chap-h{display:flex;align-items:center;gap:12px;padding:12px 14px 10px;border-bottom:2px dashed var(--line)}
.chap-h .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--c)}
.chap-h .av svg{width:100%;height:100%;display:block;background:color-mix(in srgb,var(--c) 22%,var(--panel2))}
.chap-h b{display:block;font-size:17px}.chap-h span{font-size:12px;color:var(--sub);font-weight:700}
.st{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .no{font-family:var(--f-dot);font-size:15px;width:30px;color:var(--sub)}
.st .nm{flex:1;font-weight:700;font-size:15px}
.st .md{font-size:11px;color:var(--sub);font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2)}
.lamp{width:16px;height:16px;border-radius:50%;flex:none;background:#8a8d96;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}
.lamp.on{background:var(--run);box-shadow:0 0 10px var(--runGlow),inset 0 -2px 3px rgba(0,0,0,.2)}
.lamp.cur{background:var(--amber);box-shadow:0 0 10px rgba(242,165,22,.6)}
.st.locked{opacity:.45}
.st .star{color:var(--amber);font-size:13px}
/* ---------- ADV ---------- */
.talk{position:fixed;left:0;right:0;top:var(--vvt,0px);bottom:auto;height:100vh;height:100dvh;height:var(--vvh,100dvh);z-index:50;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden;max-width:560px;margin:0 auto}
.talk-bg{position:absolute;inset:0;background:linear-gradient(180deg,#3B4D7C 0%,#5B6FA8 45%,#9DA9C8 70%,#C9CEDA 100%)}
.talk-bg svg{position:absolute;inset:0;width:100%;height:100%}
.talk-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.talk-top .chip{background:rgba(10,16,34,.55);color:#fff;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700}
.talk-top button{background:rgba(10,16,34,.55);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700}
.talk-por{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:min(92%,400px);z-index:2;transition:opacity .2s}
.talk-por svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 20px rgba(10,16,40,.35))}
.talk-por.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:translateX(-50%) translateY(8px)}100%{transform:translateX(-50%) translateY(0)}}
.talk-box{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;min-height:150px;background:rgba(255,255,255,.94);color:#1F2536;border-radius:20px;padding:26px 18px 16px;box-shadow:0 10px 30px rgba(10,16,40,.35);border:3px solid var(--nc,#8a8fa0)}
.talk-name{position:absolute;top:-16px;left:14px;background:var(--nc,#555);color:#fff;font-weight:800;padding:4px 16px;border-radius:99px;font-size:14px}
.talk-text{font-size:16px;line-height:1.75;min-height:84px}
.talk-text.narr{font-style:normal;color:#4a4f60}
.talk-next{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--nc,#555);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* note card */
.note{position:absolute;inset:auto 10px calc(env(safe-area-inset-bottom,0px) + 12px) 10px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:6;background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 14px 40px rgba(10,16,40,.45);display:flex;flex-direction:column;overflow:hidden}
.modal .note{position:relative;inset:auto;max-height:84vh}
.note-h{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;background:var(--hmi);color:var(--hmiInk)}
.note-h .tag{font-family:var(--f-dot);font-size:12px;background:var(--amber);color:#3A2600;padding:2px 8px;border-radius:6px}
.note-h h3{margin:0;font-size:18px}
.note-b{padding:14px 18px;overflow:auto;flex:1}
.note-b ul{margin:0 0 12px;padding-left:1.2em}.note-b li{margin:0 0 8px;font-size:15px}
.note-f{padding:12px 18px 16px;display:flex;justify-content:flex-end;border-top:2px solid var(--line)}
/* ---------- play ---------- */
.play{padding:10px 12px 120px}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.goal .av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--c)}
.goal .av svg{width:100%;height:100%;display:block;background:color-mix(in srgb,var(--c) 22%,var(--panel2))}
.goal p{margin:0;font-size:14px;font-weight:700;line-height:1.6}
/* HMI ladder */
.hmi{background:var(--hmi);border-radius:var(--r-lg);padding:12px 10px 12px;color:var(--hmiInk);box-shadow:inset 0 0 0 2px var(--hmiLine),var(--shadow);position:relative}
.hmi-bar{display:flex;align-items:center;gap:8px;font-family:var(--f-dot);font-size:12px;color:#9FB0D6;margin:0 4px 8px}
.hmi-bar .sp{flex:1}
.rung{position:relative;margin:0 0 10px;padding:6px 0 4px 0}
.rung-h{display:flex;align-items:center;gap:6px;margin:0 2px 4px;font-family:var(--f-dot);font-size:12px;color:#8193BD}
.rung-h .sp{flex:1}
.rung-h button{font-family:var(--f-ui);font-size:12px;font-weight:700;color:#C9D5F2;background:var(--hmi2);padding:3px 9px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hmiLine)}
.lad{display:grid;grid-template-columns:8px repeat(4,1fr) 1.45fr 8px;position:relative}
.rail{background:var(--wire);width:4px;border-radius:2px;justify-self:center}
.rail.on{background:var(--run);box-shadow:0 0 8px var(--runGlow)}
.cell{position:relative;height:58px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--wire)}
.cell.pw::before{background:var(--run);box-shadow:0 0 6px var(--runGlow)}
.cell.ed{cursor:pointer}
.cell.ed:active{background:rgba(255,255,255,.06)}
.cell.ed.empty::after{content:"＋";position:relative;z-index:1;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--hmi2);color:#6F81AA;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--hmiLine)}
.cell.off{visibility:hidden}
.cell svg{position:relative;z-index:1;width:100%;max-width:68px;height:52px;overflow:visible}
.cell.out svg{max-width:96px}
.brow .cell{height:52px}
.cell.join::after{content:"";position:absolute;right:-1.5px;width:3px;bottom:50%;height:55px;background:var(--wire);z-index:0}
.cell.join.pw::after{background:var(--run)}
.cell.joinL::after{content:"";position:absolute;left:-5px;width:3px;bottom:50%;height:58px;background:var(--wire)}
.rungadd{display:block;width:100%;padding:12px;border-radius:14px;color:#9FB0D6;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 2px dashed var(--hmiLine);border:2px dashed var(--hmiLine)}
.ctrl{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.ctrl .btn{flex:1;min-width:0;white-space:nowrap;padding-inline:.7em}
/* results */
.res{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;margin-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line)}
.tab.a{background:var(--ink);color:var(--panel)}
.tab .ok{color:var(--run)}.tab .ng{color:var(--stop)}
.tab.a .ok{color:#6CF0B5}.tab.a .ng{color:#FF8F92}
.wave{overflow-x:auto;background:var(--hmi);border-radius:12px;padding:8px 6px}
.wave svg{display:block}
.scrub{display:flex;align-items:center;gap:10px;margin-top:10px}
.scrub input{flex:1;accent-color:var(--run)}
.scrub .dot{font-size:13px;min-width:66px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.msg{margin:10px 0 0;font-size:14px;font-weight:700;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.msg.ng{box-shadow:inset 4px 0 0 var(--stop)}.msg.ok{box-shadow:inset 4px 0 0 var(--run)}
/* manual */
.man{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;margin-top:12px}
.man h4{margin:0 0 8px;font-size:14px}
.pbs{display:flex;flex-wrap:wrap;gap:10px}
.pb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#6B7DAA,#3A4A74);color:#fff;font-family:var(--f-dot);font-size:15px;box-shadow:0 4px 0 #242F4E,inset 0 0 0 3px rgba(255,255,255,.15)}
.pb.on{background:radial-gradient(circle at 50% 38%,#FFE08A,#F2A516);color:#3A2600;box-shadow:0 1px 0 #9B6A00,0 0 16px rgba(242,165,22,.6);transform:translateY(3px)}
.lamps{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.lp{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-dot);font-size:12px;color:var(--sub)}
.lp .lamp{width:30px;height:30px}
.lp .num{font-size:16px;color:var(--ink);background:var(--hmi);color:#7CF3BE;padding:2px 8px;border-radius:6px;min-width:52px;text-align:right}
/* sheet */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.modal.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:24px 24px 0 0;padding:16px 16px 22px;max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .lbl{font-size:12px;color:var(--sub);font-weight:700;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:12px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;min-width:52px}
.chip.a{background:var(--hmi);color:#7CF3BE;box-shadow:inset 0 0 0 2px var(--run)}
.chip svg{width:56px;height:36px;background:var(--hmi);border-radius:8px;margin-bottom:4px}
.chip.dv{font-family:var(--f-dot);font-size:16px}
.numin{display:flex;align-items:center;gap:8px}
.numin input{width:110px;font-family:var(--f-dot);font-size:20px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);text-align:right}
.sheet .foot{display:flex;gap:10px;margin-top:18px}.sheet .foot .btn{flex:1}
.prev{background:var(--hmi);border-radius:14px;height:70px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.prev svg{height:56px;width:120px}
/* dialog card */
.card{width:100%;max-width:420px;background:var(--panel);border-radius:24px;padding:18px;box-shadow:var(--shadow);animation:up .2s ease-out}
.say{display:flex;gap:12px;align-items:flex-start}
.say .av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--c)}
.say .av svg{width:100%;height:100%;display:block;background:color-mix(in srgb,var(--c) 22%,var(--panel2))}
.say .bub{flex:1;background:var(--panel2);border-radius:16px;padding:10px 12px;font-size:15px;font-weight:700;position:relative}
.clear-lamps{display:flex;justify-content:center;gap:14px;margin:6px 0 12px}
.clear-lamps .lamp{width:26px;height:26px;animation:lampon .5s ease-out both}
.clear-lamps .lamp:nth-child(2){animation-delay:.15s}.clear-lamps .lamp:nth-child(3){animation-delay:.3s}
@keyframes lampon{from{background:#8a8d96;box-shadow:none}}
.clear h3{text-align:center;margin:0;font-size:26px;letter-spacing:.04em}
.stats{display:flex;justify-content:center;gap:18px;margin:10px 0 4px;font-size:14px;font-weight:700;color:var(--sub)}
.stats b{font-family:var(--f-dot);font-size:20px;color:var(--ink);margin-left:4px}
/* frame / hex */
.bytes{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:calc((100% - 18px)/4);min-height:66px;border-radius:12px;background:var(--hmi2);box-shadow:inset 0 0 0 2px var(--hmiLine);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;color:var(--hmiInk)}
.slot small{font-size:10px;color:#8FA1CB;font-weight:700;line-height:1.2;text-align:center}
.slot b{font-family:var(--f-dot);font-size:22px;font-weight:400;line-height:1.3;color:#7CF3BE}
.slot b.em{color:#4A5A82}
.slot.ng{box-shadow:inset 0 0 0 2px var(--stop);background:#3A1C2A}
.slot.ok{box-shadow:inset 0 0 0 2px var(--run)}
.slot.hl{box-shadow:inset 0 0 0 2px var(--amber)}
.slot.fx b{color:#C9D5F2}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tok{min-width:64px;padding:8px 10px;border-radius:12px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tok b{font-family:var(--f-dot);font-size:20px;font-weight:400}
.tok small{font-size:11px;color:var(--sub);font-weight:700}
.tok.used{opacity:.25;pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.key{height:52px;border-radius:12px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-family:var(--f-dot);font-size:22px}
.key:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--line)}
.key.wide{grid-column:span 2;font-family:var(--f-ui);font-size:15px;font-weight:800}
.q{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.q span{flex:1;font-weight:700;font-size:14px}
.q input{width:96px;font-family:var(--f-dot);font-size:20px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);text-align:right}
.q.ng input{border-color:var(--stop)}.q.ok input{border-color:var(--run)}
.idx{display:block;font-size:10px;color:#8FA1CB;font-family:var(--f-dot)}
.pkt{height:40px;position:relative;margin:10px 0 0;overflow:hidden}
.pkt i{position:absolute;top:10px;left:-30px;width:24px;height:18px;border-radius:5px;background:var(--cyan);animation:fly 1s ease-in-out forwards}
@keyframes fly{to{left:100%}}
/* chars */
.cc{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.cc-top{display:flex;align-items:flex-end;gap:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,var(--panel2)),var(--panel2))}
.cc-top .pt{width:46%;flex:none}.cc-top .pt svg{width:100%;display:block}
.cc-top .nm{padding:0 12px 16px 0}
.cc-top .nm b{display:block;font-size:22px;line-height:1.2}
.cc-top .nm span{font-size:12px;color:var(--sub);font-weight:700}
.cc-b{padding:12px 16px 16px;font-size:14px}
.cc-b dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px}.cc-b dt{color:var(--sub);font-weight:700}.cc-b dd{margin:0}
.hearts{color:var(--heart);letter-spacing:2px;font-size:18px}
.secret{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.end{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(180deg,#2A3160,#F58CA8);padding:24px}
.end h2{font-size:34px;margin:0 0 10px}

/* ---------- character animation ---------- */
.ebk,.mt{opacity:0}
.anim .eo{animation:eo 5.2s var(--bd,0s) infinite}
.anim .ebk{animation:ebk 5.2s var(--bd,0s) infinite}
.talking .mb{animation:tA .26s steps(1) infinite}
.talking .mt{animation:tB .26s steps(1) infinite}
.breath .br{animation:breath 4.4s var(--bd,0s) ease-in-out infinite;transform-origin:150px 360px}
@keyframes eo{0%,93%,100%{opacity:1}94%,97%{opacity:0}}
@keyframes ebk{0%,93%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes tA{0%{opacity:1}50%{opacity:0}}
@keyframes tB{0%{opacity:0}50%{opacity:1}}
@keyframes breath{0%,100%{transform:none}50%{transform:translateY(1.8px)}}
.cimg{width:100%;height:auto;display:block}
.av .cimg.crop{width:100%;height:100%;object-fit:cover;object-position:50% 8%;transform:scale(1.9);transform-origin:50% 12%}
.cast{position:absolute;inset:0;z-index:2;pointer-events:none}
.por{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);transition:left .35s ease,width .35s ease,filter .25s,transform .25s}
.por svg,.por img{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 22px rgba(10,16,40,.4))}
.por.dim{filter:brightness(.58) saturate(.75);transform:translateX(-50%) translateY(14px) scale(.96)}
.por.pop{animation:popin .34s ease-out}
.por.enter{animation:fadein .4s ease-out}
@keyframes popin{0%{transform:translateX(-50%) translateY(8px)}55%{transform:translateX(-50%) translateY(-7px)}100%{transform:translateX(-50%)}}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(24px)}}
.talk-top{gap:8px}.talk-top .sp{flex:1}
.talk-box{-webkit-transform:translateZ(0);transform:translateZ(0)}
.talk-name[hidden]{display:none}
.talklog{position:absolute;inset:0;z-index:8;background:rgba(10,14,30,.72);display:flex;align-items:flex-end;padding:calc(env(safe-area-inset-top,0px) + 50px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.talklog-in{width:100%;max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:20px;padding:14px 16px}
.talklog-in h3{margin:0 0 8px;font-size:16px}.talklog-in p{margin:0 0 10px;font-size:14px;line-height:1.7}.talklog-in b{display:block;font-size:12px}
.fine{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0}
.say .bub .who{display:block;font-size:11px;color:var(--c);margin-bottom:2px}
.av-btn{padding:0;border-radius:50%;flex:none}
.goal .tapme{display:block;font-size:11px;color:var(--sub);font-weight:700;margin-top:2px}
.cheer{margin:-4px 0 12px;animation:up .2s ease-out}
.aff{text-align:center;color:var(--heart);font-weight:800;margin:10px 0 0;font-size:14px}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.exs .chip{padding:5px 11px;font-size:12px;min-width:0}
.bub1{background:var(--panel2);border-radius:14px;padding:9px 12px;font-weight:700;margin-bottom:12px;box-shadow:inset 3px 0 0 var(--c)}
.ccbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cc-top .pt{width:54%}
.endcast{display:flex;width:min(100%,420px);margin-bottom:6px}.endcast>div{flex:1;margin:0 -8%}.endcast>div:nth-child(2){z-index:2;transform:scale(1.1)}

/* ---------- raster portraits ---------- */
.rast{position:relative}
.rast>img{width:100%;height:auto;display:block}
.avimg{width:100%;height:100%;object-fit:cover;display:block}
.emo{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:emo .35s ease-out both;z-index:2}
.emo svg{width:100%!important;height:auto;display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))!important}
.emo.tw{animation:emo .35s ease-out both,tw 1.6s .35s ease-in-out infinite}.emo.d2{animation-delay:.1s,.9s}
.emo.puls{animation:emo .35s ease-out both,puls 1.1s .35s ease-in-out infinite}
.emo.drip{animation:emo .35s ease-out both,drip 2.2s .35s ease-in-out infinite}
@keyframes emo{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
@keyframes tw{50%{transform:translate(-50%,-50%) scale(.75) rotate(20deg)}}
@keyframes puls{50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes drip{50%{transform:translate(-50%,-35%)}}
.breath .rast>img{animation:breathI 4.4s var(--bd,0s) ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathI{50%{transform:translateY(1.5px) scaleY(1.004)}}
.talking .rast{animation:talk .34s ease-in-out infinite}
@keyframes talk{50%{transform:translateY(-3px)}}
.por.hasimg{bottom:30px}
.t-cast .p .rast>img{filter:none}

/* ---------- photo backgrounds ---------- */
.talk-bg.img{background-size:cover;background-position:62% 30%;background-color:#2A3160}
.talk-bg.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,52,.25) 0%,rgba(20,24,52,0) 25%,rgba(20,24,52,0) 55%,rgba(20,24,52,.45) 100%)}
.talk-bg.img.ep::after{background:linear-gradient(180deg,rgba(20,24,52,.18) 0%,rgba(20,24,52,0) 22%,rgba(20,24,52,0) 60%,rgba(20,24,52,.35) 100%)}
.talk-bg.img.night{filter:brightness(.5) saturate(.6) contrast(1.05)}
.talk-bg.img.night::after{background:linear-gradient(180deg,rgba(30,40,110,.55),rgba(10,14,40,.5))}
.talk-bg.img.noon{filter:brightness(1.08) saturate(.9)}
.talk-bg.img.noon::after{background:linear-gradient(180deg,rgba(160,210,255,.35),rgba(255,255,255,0) 60%)}
.talk-bg.img.cool{filter:saturate(.8) brightness(.85)}
.talk-bg.img.cool::after{background:linear-gradient(180deg,rgba(40,200,190,.18),rgba(20,24,52,.4))}
.t-sky.img{background-size:cover;background-position:58% 35%}
.t-sky.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(240,110,160,.55) 0%,rgba(245,140,168,.25) 32%,rgba(106,111,201,.1) 55%,rgba(20,24,52,.55) 100%)}

/* ---------- event CG ---------- */
.talk-cg{position:absolute;inset:0;z-index:3;pointer-events:none}
.talk-cg:empty{display:none}
.cg-blur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}
.cg-img{position:absolute;left:0;right:0;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 48px);width:100%;max-height:calc(100% - 220px - env(safe-area-inset-top,0px));object-fit:contain;animation:cgin 1.4s ease-out both;transition:max-height .3s,top .3s}
.cg-flash{position:absolute;inset:0;background:#fff;animation:flash 1s ease-out forwards}
.talk-cg.out{animation:cgout .45s ease-in forwards}
@keyframes cgin{from{transform:scale(1.06);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@keyframes cgout{to{opacity:0}}
.talk.cgmode .cast{opacity:0;transition:opacity .3s}
.talk.nobox .talk-box{opacity:0;pointer-events:none}
.talk.hideui .talk-box,.talk.hideui .talk-top{opacity:0;pointer-events:none}
.talk.hideui .cg-img{top:0;bottom:0;margin:auto;max-height:100%}
.talk-top .chip,.talk-top button{white-space:nowrap;font-size:12px;padding:6px 11px}
.talk-top{z-index:6}.talk-box{z-index:6;transition:opacity .25s}
.album{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;margin-bottom:16px}
.album h3{margin:0 0 10px;font-size:16px}.album h3 span{font-family:var(--f-dot);font-size:13px;color:var(--sub);margin-left:6px}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alb-i{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:2/3;padding:0;box-shadow:0 0 0 2px var(--c)}
.alb-i img{width:100%;height:100%;object-fit:cover;display:block}
.alb-i span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 6px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(0deg,rgba(10,14,30,.85),transparent);line-height:1.35}
.alb-i.lk img{filter:blur(12px) grayscale(.8) brightness(.6);transform:scale(1.2)}
.alb-i.lk span{top:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(10,14,30,.35)}
.cgv{position:fixed;inset:0;z-index:95;background:#070A14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.cgv img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;animation:cgin .5s ease-out both}
.cgv p{color:#C9D5F2;font-size:12px;margin:8px 0;font-weight:700}

/* ---------- special episode entry ---------- */
.st-row{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-right:12px}
.st-row:last-child{border-bottom:0}
.st-row .st{border-bottom:0;flex:1;min-width:0}
.st .nm small{display:block;font-size:11px;color:var(--sub);font-weight:700;line-height:1.3}
.spb{flex:none;position:relative;display:flex;align-items:center;gap:3px;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--heart) 14%,var(--panel2));color:var(--heart);font-weight:800;font-size:15px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--heart) 45%,transparent)}
.spb span{font-family:var(--f-dot);font-size:11px}
.spb.cg{background:var(--heart);color:#fff;box-shadow:0 2px 0 #B83A70}
.spb.new::after{content:"NEW";position:absolute;top:-8px;right:-6px;font-family:var(--f-dot);font-size:9px;background:var(--amber);color:#3A2600;padding:1px 4px;border-radius:5px}
.spb.off{background:none;box-shadow:none;color:var(--line);font-size:18px}
.sphint{margin:-8px 2px 14px;font-size:12px;color:var(--sub);font-weight:700}
.sphint b{color:var(--heart)}
.spnow{display:block;width:100%;margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--heart) 12%,var(--panel2));color:var(--ink);font-weight:800;font-size:14px;text-align:left;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--heart) 50%,transparent)}
.spnow span{float:right;color:var(--heart)}

/* ---------- finale / logo ---------- */
.talk-bg.img.ep.dusk{filter:sepia(.45) saturate(1.35) hue-rotate(-18deg) brightness(.92)}
.talk-bg.img.ep.dusk::after{background:linear-gradient(180deg,rgba(255,120,80,.35) 0%,rgba(255,170,120,.15) 45%,rgba(40,20,60,.45) 100%)}
.finale{display:flex;flex-direction:column;align-items:flex-start;width:100%;position:relative;margin:0 0 14px;padding:12px 14px;border-radius:var(--r-lg);text-align:left;color:#fff;background:linear-gradient(135deg,#F58CA8,#F2A516);box-shadow:0 3px 0 #B83A70,var(--shadow)}
.finale .fl-t{font-size:11px;font-weight:800;opacity:.9}
.finale b{font-size:17px;line-height:1.4;padding-right:74px}
.finale .fl-go{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#fff;color:var(--heart);font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px}
.finale.new::after{content:"NEW";position:absolute;top:-8px;left:12px;font-family:var(--f-dot);font-size:10px;background:var(--amber);color:#3A2600;padding:1px 5px;border-radius:5px;box-shadow:0 0 0 2px #fff}
.finale.lk{background:var(--panel);color:var(--sub);box-shadow:inset 0 0 0 2px dashed var(--line);border:2px dashed var(--line)}
.finale.lk b{font-size:14px}
.alb{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
.alb-i:last-child{grid-column:span 1}
.alb-i span{font-size:10px!important}
.t-logo{padding-top:7vh}
.t-logo h1.imglogo{margin:0 auto;width:min(96%,460px);text-shadow:none}
.t-logo h1.imglogo img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(60,20,60,.35))}
.t-logo p.sub{display:inline-block;margin-top:6px;font-size:14px;font-weight:800;letter-spacing:.08em;color:#fff;background:rgba(31,45,75,.72);padding:4px 14px;border-radius:99px;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.endlogo{width:min(80%,360px);margin:4px 0 0}
.end .btn:not(.pk){color:var(--ink)}
.askmsg{margin:0;font-size:15px;font-weight:700;line-height:1.7}
.plantbox{margin:6px 2px 0;padding:8px 10px;border-radius:12px;background:var(--hmi2);box-shadow:inset 0 0 0 1px var(--hmiLine)}
.plantbox span{display:block;font-size:11px;color:#8FA1CB;font-weight:700}
.cyl{width:100%;max-width:340px;height:auto;display:block}
.q.qc{flex-direction:column;align-items:flex-start;gap:8px}.q.qc .chips{gap:6px}.q.qc .chip{font-size:13px;padding:6px 10px}
.gl{display:flex;flex-direction:column;gap:8px}
.gli{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px}
.gli summary{cursor:pointer;display:flex;align-items:baseline;gap:8px;list-style:none}
.gli summary::-webkit-details-marker{display:none}
.gli summary b{font-size:15px}.gli summary span{font-size:11px;color:var(--sub);font-weight:700;margin-left:auto;flex:none}
.nbl{display:flex;flex-direction:column;gap:6px;margin-top:8px}.nbi{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg,#f4f2ec);border:0;border-radius:10px;padding:9px 10px;font:inherit;color:inherit;cursor:pointer}.nbi .no{font-family:monospace;font-size:12px;color:var(--sub);flex:none;width:34px}.nbi b{font-size:14px;flex:1}.nbi .nt{font-size:11px;color:var(--sub);flex:none}.nbi.lk{opacity:.5;cursor:default}

<script>
// ===== ENGINE =====
function crc16(bytes){let c=0xFFFF;for(const b of bytes){c^=b;for(let i=0;i<8;i++){c=(c&1)?((c>>1)^0xA001):(c>>1);}}return [c&0xFF,(c>>8)&0xFF];}
function hx(n){return n.toString(16).toUpperCase().padStart(2,'0');}
function parseCell(s){if(!s)return null;
  let m=s.match(/^(D\d+)(>=|<=|<>|>|<|=)(\d+)$/);if(m)return{t:'CMP',a:m[1],op:m[2],k:+m[3]};
  if(s[0]==='!')return{t:'NC',d:s.slice(1)};if(s[0]==='^')return{t:'P',d:s.slice(1)};return{t:'NO',d:s};}
function parseOut(s){const p=s.split(' ');const t=p[0];
  if(t==='TON'||t==='CTU')return{t,d:p[1],k:+p[2]};
  if(['MOV','ADD','SUB','MUL','DIV'].includes(t)){if(/^D\d/.test(p[1]))return{t,s:p[1],d:p[2]};return{t,k:+p[1],d:p[2]};}return{t,d:p[1]};}
function R(row,out,br,span){const c=[null,null,null,null],b=[null,null,null,null];
  (row?row.split(' '):[]).forEach((x,i)=>c[i]=parseCell(x));
  (br?br.split(' '):[]).forEach((x,i)=>b[i]=parseCell(x));
  return{c,b,span:br?(span||1):0,out:parseOut(out)};}
function emptyRung(){return{c:[null,null,null,null],b:[null,null,null,null],span:0,out:null};}
function cloneProg(p){return JSON.parse(JSON.stringify(p));}
function countElems(prog){let n=0;for(const r of prog){r.c.forEach(x=>{if(x)n++});if(r.span)r.b.forEach((x,i)=>{if(x&&i<r.span)n++});if(r.out)n++;}return n;}
function inputAt(test,dev,t){const v=test.in[dev];if(!v)return 0;
  if(dev[0]==='D'){let val=0;for(const [tt,vv] of v){if(tt<=t)val=vv;}return val;}
  for(const [a,b] of v){if(t>=a&&t<b)return 1;}return 0;}
function newMem(){return{bit:{},T:{},C:{},D:{},prevX:{},pc:{}};}
function val(mem,a){return typeof a==='number'?a:(mem.D[a]||0);}
function cmp(op,a,b){switch(op){case'>=':return a>=b;case'<=':return a<=b;case'>':return a>b;case'<':return a<b;case'=':return a===b;case'<>':return a!==b;}return false;}
function evalCell(mem,cell){if(!cell)return true;
  if(cell.t==='CMP')return cmp(cell.op,val(mem,cell.a),cell.k);
  const v=!!mem.bit[cell.d];if(cell.t==='NO')return v;if(cell.t==='NC')return !v;
  if(cell.t==='P')return v&&!mem.prevX[cell.d];return false;}
function scan(prog,mem,inputs){ // inputs: {X0:0/1, D0:val}
  for(const k in inputs){if(k[0]==='X')mem.bit[k]=inputs[k];else mem.D[k]=inputs[k];}
  const st=[];
  prog.forEach((r,ri)=>{const cs=r.c.map(x=>evalCell(mem,x));const bs=r.b.map(x=>evalCell(mem,x));
    const s=r.span;const hasB=s&&r.b.slice(0,s).some(x=>x);
    let left=true;for(let i=0;i<(hasB?s:0);i++)left=left&&cs[i];
    let bl=true;for(let i=0;i<(hasB?s:0);i++)bl=bl&&bs[i];
    let cond=hasB?(left||bl):true;for(let i=(hasB?s:0);i<4;i++)cond=cond&&cs[i];
    // power flow for display
    const pc=[],pb=[];
    let a=true;for(let i=0;i<4;i++){if(hasB&&i===s)a=left||bl;const inP=a;pc[i]=inP&&cs[i];a=a&&cs[i];}
    let bb=true;for(let i=0;i<4;i++){pb[i]=hasB&&i<s&&bb&&bs[i];bb=bb&&bs[i];}
    const o=r.out;if(o){const d=o.d;
      if(o.t==='OUT')mem.bit[d]=cond?1:0;
      else if(o.t==='SET'){if(cond)mem.bit[d]=1;}
      else if(o.t==='RST'){if(cond){mem.bit[d]=0;if(d[0]==='T'||d[0]==='C'){(d[0]==='T'?mem.T:mem.C)[d]=0;}if(d[0]==='D')mem.D[d]=0;}}
      else if(o.t==='TON'){if(cond){mem.T[d]=Math.min((mem.T[d]||0)+1,o.k);}else mem.T[d]=0;mem.bit[d]=(mem.T[d]>=o.k)?1:0;}
      else if(o.t==='CTU'){const key='r'+ri;if(cond&&!mem.pc[key]){mem.C[d]=Math.min((mem.C[d]||0)+1,32767);}mem.pc[key]=cond;mem.bit[d]=((mem.C[d]||0)>=o.k)?1:0;}
      else if(o.t==='MOV'){if(cond)mem.D[d]=o.s?(mem.D[o.s]||0):o.k;}
      else if(o.t==='ADD'){if(cond){const v=o.s?(mem.D[o.s]||0):o.k;mem.D[d]=(mem.D[d]||0)+v;}}
      else if(o.t==='SUB'){if(cond){const v=o.s?(mem.D[o.s]||0):o.k;mem.D[d]=(mem.D[d]||0)-v;}}
      else if(o.t==='MUL'){if(cond){const v=o.s?(mem.D[o.s]||0):o.k;mem.D[d]=(mem.D[d]||0)*v;}}
      else if(o.t==='DIV'){if(cond){const v=o.s?(mem.D[o.s]||0):o.k;mem.D[d]=v?Math.trunc((mem.D[d]||0)/v):0;}}
    }
    st.push({pc,pb,cs,bs,cond});
  });
  for(const k in inputs){if(k[0]==='X')mem.prevX[k]=inputs[k];}
  return st;}
function readDev(mem,d){if(d[0]==='D')return mem.D[d]||0;return mem.bit[d]?1:0;}
const PLANTS={cyl:{init:()=>({pos:0}),sense:p=>({X1:p.pos>=6?1:0,X2:p.pos<=0?1:0}),step:(p,mem)=>{const f=mem.bit.Y0,b=mem.bit.Y1;if(f&&!b)p.pos=Math.min(6,p.pos+1);else if(b&&!f)p.pos=Math.max(0,p.pos-1);}}};
function runTest(prog,test,devs,plant){const mem=newMem();const trace={};devs.forEach(d=>trace[d]=[]);const frames=[];const ps=plant?plant.init():null;
  for(let t=0;t<test.len;t++){const inp={};for(const k in test.in)inp[k]=inputAt(test,k,t);if(plant)Object.assign(inp,plant.sense(ps));
    const st=scan(prog,mem,inp);devs.forEach(d=>trace[d].push(readDev(mem,d)));
    frames.push({st,mem:JSON.parse(JSON.stringify({bit:mem.bit,T:mem.T,C:mem.C,D:mem.D})),ps:ps?JSON.parse(JSON.stringify(ps)):null});if(plant)plant.step(ps,mem);}
  return{trace,frames};}
function compareTrace(exp,act){ // returns array of mismatch ticks (only stable ticks checked)
  const bad=[];for(let t=0;t<exp.length;t++){const e=exp[t];
    const stable=(t===0||exp[t-1]===e)&&(t===exp.length-1||exp[t+1]===e);if(!stable)continue;
    if(act[t]!==e)bad.push(t);}return bad;}
function verifyBlink(test,y,x){ // custom flicker check
  const L=y.length;let errs=[];
  for(let t=0;t<L;t++){const xi=inputAt(test,x,t);const xp=t>0?inputAt(test,x,t-1):0;
    if(!xi&&!xp&&y[t])errs.push(t);}
  // find X on segments
  for(const [a,b] of test.in[x]){ if(!y.slice(a,a+3).some(v=>v))errs.push(a);
    let runs=[];let cur=y[a+1],len=0;for(let t=a+1;t<b;t++){if(y[t]===cur)len++;else{runs.push([cur,len,t]);cur=y[t];len=1;}}
    runs.slice(1).forEach(([v,l,t])=>{if(l<4||l>7)errs.push(t-1);});
    if(runs.length<3)errs.push(b-1);
  }
  return errs;}
function verifyAlarm(test,y){ // Y0: blink until ack, steady after ack, off when no alarm
  const L=y.length,errs=[];const X=(k,t)=>inputAt(test,k,t);
  for(let t=1;t<L;t++){if(!X('X0',t)&&!X('X0',t-1)&&y[t])errs.push(t);}
  for(const [a,b] of test.in.X0){const end=Math.min(b,L);let ack=null;for(let t=a;t<end;t++){if(X('X1',t)){ack=t;break;}}

 note:{title:'警報の点滅と確認',lines:['未確認の異常：ランプ点滅＋ブザー。','確認済みの異常：ランプ点灯、ブザー停止。','異常が消えたら：消灯。確認状態もリセットする。','確認状態は M0 に自己保持で記憶する。(X1 または M0) かつ X0。異常 X0 が消えると保持も切れる。','点滅はフリッカ回路（T0/T1）を使う。'],ex:[R('X0 !T1','TON T0 5'),R('!T0 X0','OUT Y0','M0',1)]},
 hints:['フリッカ：X0,!T1 → TON T0 K5、T0 → TON T1 K5','確認：(X1 または M0) かつ X0 → OUT M0（自己保持）','Y0：(!T0 または M0) かつ X0、Y1：X0 かつ !M0'],
 outro:[['kanade','h','…点滅、確認、点灯。現場の人がちゃんと気づける警報ね。']]},
{title:'アナログ値のスケーリング',ch:4,char:'kanade',mode:'ladder',
 goal:'温度センサのA/D変換値が D0 に入る（0〜4000）。これを0.1℃単位の温度（0〜150.0℃ → 0〜1500）に変換して D10 に格納しよう。',

 tests:[{name:'温度変化',len:24,in:{D0:[[0,0],[4,1000],[8,2000],[12,2345],[16,4000],[20,3999]]}}],watch:['D10'],show:['D0','D10'],
 intro:[['kanade','n','温度や圧力は、センサからアナログ信号で入ってくる。PLCのA/D変換ユニットがそれを数値に変えるの。'],['kanade','t','でも、A/D変換の値は「0〜4000」みたいな生の数字。そのままじゃ温度として使えないわ。'],['kanade','n','工学単位に直す――これがスケーリングよ。'],['note'],['kanade','a','計算の順番を間違えると、値が全部0になるわよ。']],
 note:{title:'スケーリング',lines:['工学値 ＝ A/D値 × 工学値の最大 ÷ A/D値の最大。','今回は D10 ＝ D0 × 1500 ÷ 4000（0.1℃単位なので 150.0℃ → 1500）。','整数演算では、割り算で小数が切り捨てられる。必ず先に掛けてから割ること。','接点を置かないラングは毎スキャン実行される（常時ON）。','実機では 4000×1500 が16ビットの上限（32767）を超えるので、32ビット演算命令を使う。'],ex:[R('','MOV D0 D10'),R('','MUL 1500 D10'),R('','DIV 4000 D10')]},
 hints:['まず MOV で D0 を D10 にコピー（転送元に D0 を選ぶ）','MUL K1500 → DIV K4000 の順番で。接点は置かなくていい'],
 outro:[['kanade','h','A/D値2345が87.9℃。…正確ね。順番を守れる人は信用できるわ。']]},

 intro:[['kanade','n','現場のアナログ信号でいちばん多いのが、4-20mAの電流信号。'],['kanade','n','0%で4mA、100%で20mA。0から始まらないのには理由があるの。'],['kanade','t','0mAなら「値がゼロ」じゃなくて「線が切れている」と判断できる。断線検知ね。'],['note']],
 note:{title:'4-20mAとオフセット',lines:['このA/D変換ユニットでは 0mA=0、4mA=800、20mA=4000。','工学値 ＝（A/D値 − 800）× 1000 ÷ 3200。オフセット（800）を先に引く。','4mAを大きく下回る値（例：3.2mA＝640未満）は断線として扱う。','マイナスの値は、割り算で0の方向に切り捨てられる。'],ex:[R('','SUB 800 D10'),R('D0<640','OUT Y0')]},
 hints:['MOV D0 D10 → SUB K800 → MUL K1000 → DIV K3200','断線：比較接点 D0 < 640 → OUT Y0'],
 outro:[['kanade','h','断線もちゃんと見つけられるわね。'],['kanade','n','最後にもう一つ。警報がパタパタしないための工夫を教えるわ。']]},

 note:{title:'フレームとASCIIコード',lines:['シリアル通信（RS-232C / RS-485）では、データを1バイトずつ順番に送る。','STX（02h）で開始、ETX（03h）で終了を知らせる形式がよく使われる。','文字はASCIIコードで送る。\'0\'=30h、\'1\'=31h、\'A\'=41h… \'R\'=52h、\'D\'=44h。','数字の「1」と文字の「\'1\'」は別物。\'1\' は 31h として送られる。'],bytes:['02','30','31','52','44','03']},

{title:'チェックサム',ch:5,char:'tsunagi',mode:'hex',

 intro:[['tsunagi','a','工場ってノイズだらけなんだよね。インバータとかモータとか。'],['tsunagi','n','途中でビットが化けても気づけるように、最後に「検算用の値」を付けるの。'],['note'],['tsunagi','w','電卓使っても怒んないよ〜。16進の足し算、慣れよ慣れ！']],
 note:{title:'チェックサム（SUM）',lines:['送るデータを全部足して、その下位1バイトだけを付け加える。','受信側も同じ計算をして、一致しなければ「化けた」と判断する。','例：F0h + 20h = 110h → 下位1バイトは 10h。','16進数は A=10 … F=15。16で繰り上がる。','実際の手順書では、この値をさらにASCII 2文字（\'8\' \'C\'など）にして送ることも多い。']},

 intro:[['tsunagi','n','Modbusは1979年生まれのプロトコル。古いけど、今でも工場のそこら中で使われてんの。'],['tsunagi','n','マスタが質問して、スレーブが答える。質問しないと絶対しゃべらない、礼儀正しいやつ。'],['note']],
 note:{title:'Modbus RTU 要求フレーム',lines:['[スレーブアドレス][機能コード][データ…][CRC] の順に、バイナリで送る。','機能コード 03h = 保持レジスタ読み出し、06h = 1個書き込み、10h = 複数書き込み。','アドレスや個数は2バイト。上位バイトが先（ビッグエンディアン）。','CRC-16 は2バイトで、ここだけ下位バイトが先。この要求のCRC値は 0BC4h なので、C4 → 0B の順に送る。'],bytes:['01','03','00','00','00','02','C4','0B']},

{title:'はじめての名札',lines:[['sys','n','初日の昼休み。休憩室で、リレ先輩が何かを一生懸命書いている。'],['rire','h','あ、いたいた！はいこれ、キミの名札。私が書いたんだ〜。'],['rire','t','字、汚くない？…大丈夫？よかった〜。'],['rire','w','最初に点いたランプ、覚えてる？X0を押したらY0が点くやつ。'],['rire','b','あれね、私も新人のとき同じ回路から始めたの。だから、ちょっとうれしかった。'],['rire','h','明日からもよろしくね、新人くん！']]},
{title:'非常停止ボタンの秘密',lines:[['sys','n','ライン脇。リレ先輩が、赤いキノコ形のボタンを指さしている。'],['rire','n','これ、非常停止ボタン。中身はb接点なんだよ。'],['rire','s','もし配線が切れたらどうなると思う？a接点だと「押しても止まらない」機械になっちゃうの。'],['rire','n','b接点なら、断線した瞬間に「押された」のと同じ扱いになって止まる。安全側に倒れる、ってやつ。'],['rire','t','…人間もそうだといいのにね。私、疲れてても止まれないタイプだから。'],['rire','w','キミは無理しないでね？止まるのも、大事な機能なんだから！']]},
{title:'両手押しの約束',lines:[['sys','n','プレス機の前。リレ先輩が両手をボタンに置いてみせる。'],['rire','n','両手押しってただのANDなんだけど、私けっこう好きなんだ。'],['rire','n','「手を型から離しておいてね」っていう、機械からのお願いみたいで。'],['rire','h','設計する側がちゃんと人のことを考えてる感じ、しない？'],['rire','b','…あ、今ちょっと笑った？ポエムっぽかった？忘れて！'],['rire','w','でもね、キミにはそういう回路が書ける人になってほしいな。']]},
{title:'呼び出しブザー',lines:[['sys','n','休憩中。ラインの呼び出しブザーが鳴り響いた。'],['rire','s','あ、3番ラインだ！…って、これキミのOR回路じゃん！'],['rire','h','どっちの端から押しても鳴る。ちゃんと動いてるね〜。'],['rire','n','呼ばれたらすぐ行く。現場ってそれが一番大事なんだ。'],['rire','w','キミも困ったら、どっちの端からでも私を呼んでいいからね。ブザー代わりに！']]},
{title:'保持されているもの',lines:[['sys','n','終業後。リレ先輩と並んで、回り続けるコンベアを眺めている。'],['rire','n','自己保持ってさ、一回ONになったら、自分の力でONを保ち続けるでしょ。'],['rire','t','私、新人の頃は何回も辞めたいって思ったんだ。でも一回「好き」ってスイッチが入ったら、なんか続いちゃって。'],['rire','h','…自己保持回路みたいだよね、それ。'],['rire','b','キミにも、そういうスイッチが入ってくれたらうれしいな。…停止ボタンは、押さないでね？']]},
{title:'同時には入れない',lines:[['sys','n','昇降リフトの試運転が終わった。リレ先輩がほっと息をつく。'],['rire','h','インターロック完璧！正転と逆転、絶対に同時には入らないね。'],['rire','n','現場ではプログラムだけじゃなくて、電磁接触器の配線でもロックをかけるの。二重の安全だよ。'],['rire','s','…あ、そういえば。明日から生産技術のカナデさんが、タイマの指導に来るって。'],['rire','t','カナデさん、すっごく厳しいんだよ〜。0.1秒でもずれたら眼鏡が光るの。'],['rire','w','でも大丈夫！キミならきっと気に入られるよ。…ちょっと妬けるけど。']]},
{ref:'rire'},
{title:'0.1秒の人',bg:'office',lines:[['sys','n','生産技術室。カナデさんのモニターには、細かい波形がびっしり並んでいる。'],['kanade','n','…何？波形がそんなに珍しい？'],['kanade','n','センサの信号は嘘をつくわ。一瞬だけONになったり、揺れたり。だから時間で確かめるの。'],['kanade','t','人も同じ。一回の印象じゃ判断しない。…ちゃんと続くかどうか、見てるから。'],['kanade','a','期待してるって意味じゃないわよ。評価の手順の話。']]},
{title:'数えているもの',lines:[['sys','n','昼休み。カナデさんが手帳に「正」の字を書き込んでいる。'],['kanade','s','…見たわね。'],['kanade','b','これは…今週、あなたが自分で解決できた不具合の数よ。'],['kanade','n','3つ溜まったら、何かご褒美をあげようと思って。カウンタと同じ。設定値に達したら出力がONになるの。'],['kanade','w','今、2つ目。…リセットされないように、せいぜい頑張りなさい。']]},
{title:'点滅する気持ち',lines:[['sys','n','夕方。完成したパトライトが、規則正しく点滅している。'],['rire','h','カナデさーん！新人くんのフリッカ回路、きれいに点滅してる〜！'],['kanade','n','当然よ。周期も点灯時間も、仕様どおり。'],['rire','w','ねぇねぇ、今カナデさん、ちょっと笑ってなかった？'],['kanade','a','…笑ってない。点滅の光が反射しただけ。'],['rire','h','反射でほっぺが赤くなるんだ〜？'],['kanade','b','…リレ。あなたのタイマ、今すぐリセットしてあげましょうか。']]},
{title:'境界線',lines:[['sys','n','冷却ファンが静かに回り出した。カナデさんが温度表示をじっと見ている。'],['kanade','n','50以上で回る。49では回らない。境界がはっきりしていると、安心するの。'],['kanade','t','…人との距離は、どこからが「近い」なのかしらね。仕様書があればいいのに。'],['kanade','s','な、何でもないわ。独り言よ。'],['kanade','b','…あなたは今、たぶん48くらい。ファンが回るかどうかの、ぎりぎり手前。']]},
{title:'上書きできないもの',lines:[['sys','n','段取り替えの時間。カナデさんがストップウォッチを手にしている。'],['kanade','n','製品Aから製品Bへ。設定値を書き換えるだけで、ラインはまるで別物になる。'],['kanade','n','MOVは「上書き」。前の値は、きれいに消えてしまう。'],['kanade','t','…私、上書きが苦手なの。前の値を、ずっと覚えていたくなるから。'],['kanade','h','だから記録を取るのよ。あなたの成長も、ちゃんと全部残してあるわ。'],['kanade','b','…べ、別に変な意味じゃないから。']]},
{title:'押した瞬間に一回だけ',lines:[['sys','n','休憩所の自販機の前。カナデさんがボタンを長押ししている。'],['kanade','a','…出てこないわね。'],['kanade','n','押している「間」じゃなくて、押した「瞬間」に1回だけ反応する。自販機も立ち上がり検出なのよ。'],['kanade','s','長押ししても2本は出てこない。当然ね。'],['kanade','b','…なに見てるの。甘いミルクティーが好きで、悪い？'],['kanade','w','あなたの分も押してあげる。立ち上がり、もう1回。']]},
{ref:'kanade'},
{title:'忘れないということ',lines:[['sys','n','夕方の点検。リレ先輩が、古い異常履歴のノートをめくっている。'],['rire','n','異常ってね、一瞬で消えることが多いの。でも、消えたからって「なかったこと」にはしない。'],['rire','t','私、昔ちっちゃい異常を見逃したことがあって…あとで大きな故障になっちゃったんだ。'],['rire','n','だから記憶して、原因がなくなったのを確かめてからリセット。'],['rire','b','…キミが困ってたこと、私ちゃんと覚えてるからね。解決するまで、リセットしないよ。']]},
{title:'止める勇気',lines:[['sys','n','ラインが止まった。赤いランプの前で、リレ先輩が腕を組んでいる。'],['rire','s','過負荷でちゃんと止まった！キミの回路、えらい！'],['rire','n','止まらない機械のほうがずっと怖いんだよ。モータが焼けたり、人がケガしたり。'],['rire','t','生産が止まると怒られるけど…止めるべきときに止めるのが、制御屋の仕事。'],['rire','w','キミもさ、しんどいときはちゃんと止まってね。私がリセットボタン押してあげるから！']]},
{title:'三色の約束',lines:[['sys','n','シグナルタワーが、緑、黄、赤と順番に試験点灯している。'],['rire','h','緑は運転中、黄色は停止中、赤は異常！遠くからでも一目でわかるでしょ。'],['kanade','n','色の意味を工場全体でそろえるのが大事なの。人によって意味が違ったら、信号の意味がなくなるわ。'],['rire','w','じゃあさ、私たちの色も決めよっか！私はオレンジ！'],['kanade','a','…タワーにオレンジはないわよ。'],['rire','b','えー！じゃあ新人くんのために、心の中で点灯させとくね！']]},
{title:'確認済み',bg:'office',lines:[['sys','n','警報試験が終わった。カナデさんが、止まったブザーの前で小さく息をつく。'],['kanade','n','鳴り続ける警報は、やがて誰も聞かなくなる。だから「確認しました」を伝える仕組みが要るの。'],['kanade','t','…私、昔は全部一人で抱えて、誰にも確認ボタンを押してもらえなかった側だったわ。'],['kanade','b','今は、あなたが気づいてくれる。点滅していても、ちゃんと見てくれる人がいるのは…悪くないわね。'],['kanade','a','な、何よその顔。確認したなら、ブザーを止めなさい。']]},
{title:'割る前に掛ける',lines:[['sys','n','休憩時間。カナデさんが電卓も使わずに、数字を紙に書き連ねている。'],['kanade','n','2345×1500÷4000。先に割ると0になって、全部台無し。掛けてから割る。順番がすべてよ。'],['kanade','t','気持ちも同じね。先に結論を出して割り切ると、大事な端数まで消えてしまう。'],['kanade','b','…あなたとの時間は、まだ割らずに掛け算しておきたいの。'],['kanade','s','い、今のは数式の話よ。桁あふれに注意しなさいってこと。']]},
{title:'4mAの意味',lines:[['sys','n','計装盤の前。カナデさんがテスターの表示を見せてくれた。'],['kanade','n','4-20mAは、値が0でも4mA流れているの。だから0mAになったら「値がゼロ」じゃなくて「線が切れた」とわかる。'],['kanade','h','何もないときも、小さく信号を出し続ける。よくできた仕組みでしょう。'],['kanade','t','…黙っているように見えても、ちゃんと4mAは流れてる。そういう人もいるのよ。'],['kanade','n','そうだ。明日から通信担当の子が来るわ。ちょっと騒がしいけど、腕は確かよ。'],['kanade','w','あなたとは…たぶん気が合うと思う。少し、妬けるくらいにね。']]},
{title:'はじめましてのフレーム',bg:'rack',lines:[['sys','n','通信室の前。ヘッドホンの女の子が、ケーブルの束と格闘している。'],['tsunagi','s','わっ、びっくりした！あんたが噂の新人？リレ先輩とカナデさんのお気に入りの。'],['tsunagi','n','通信ってさ、形が決まってないと相手に伝わんないの。STXで始めて、ETXで終わる。'],['tsunagi','w','人間の会話もそうじゃん？「おはよう」で始まって「またね」で終わる。'],['tsunagi','h','…ってわけで、おはよ！今日からよろしく〜！']]},
{title:'ノイズの多い日',bg:'rack',lines:[['sys','n','雨の日。インバータのうなる音が、いつもより大きく聞こえる。'],['tsunagi','t','今日ノイズひど〜。チェックサムエラー、朝から5回目。'],['tsunagi','n','でもさ、エラーが出るってことは、ちゃんと間違いに気づけてるってことだから。'],['tsunagi','a','一番怖いのは、化けてるのに誰も気づかないやつ。'],['tsunagi','b','…あんたはさ、あたしの言葉が化けてたら、ちゃんと聞き返してくれる？'],['tsunagi','w','なーんてね！再送要求はいつでも受け付けてまーす！']]},
{title:'礼儀正しいプロトコル',bg:'roof',lines:[['sys','n','昼休みの屋上。ツナギがModbusの仕様書をうれしそうにめくっている。'],['tsunagi','h','見て見て、Modbusって1979年生まれなんだって！あたしより全然年上！'],['tsunagi','n','マスタが聞いて、スレーブが答える。勝手にしゃべらない。ルールがはっきりしてて好きなんだよね。'],['rire','s','ツナギちゃん、また仕様書読んでる〜。お昼それだけ？'],['tsunagi','w','リレ先輩！これがあたしのごはんなの〜。'],['rire','h','はい、焼きそばパン半分こ。新人くんも、ほら！']]},
{title:'読みとれない返事',bg:'rack',lines:[['sys','n','夕方の通信室。ツナギがモニターの16進数を指でなぞっている。'],['tsunagi','n','00 64で100、01 F4で500。数字って、読み方さえわかれば全部しゃべってくれるんだよね。'],['tsunagi','t','人の気持ちもさ、16進ダンプで見れたらいいのに。'],['tsunagi','b','…たとえばさ、あんたが今、あたしのことどう思ってるか、とか。'],['tsunagi','s','いや、今のは例題！例題だから！答え合わせしなくていいから！']]},
{title:'ポート502',lines:[['sys','n','事務所。カナデさんとツナギが、同じモニターを覗き込んでいる。'],['kanade','n','Modbus TCP、ポート502。…この新人、MBAPヘッダまで一発で組んだのね。'],['tsunagi','h','でしょ〜！あたしの教え方がいいから！'],['kanade','a','教え方というより、本人の理解が早いのよ。'],['tsunagi','w','え、カナデさんが素直に褒めた！録音しとけばよかった〜！'],['kanade','b','…ツナギ。そのヘッドホン、しばらく没収するわよ。']]},
{ref:'tsunagi'}

 note:{title:'応答待ち時間（タイムアウト）とリトライ',lines:['応答待ち時間は、機器の最大応答時間より長く、余裕を持たせる。','リトライ回数は、ノイズなどの一時的な失敗を吸収するため。0回だと1回の失敗で異常になる。','本当に途絶えたときの検出時間 ＝ 応答待ち時間 ×（リトライ回数＋1）。','待ち時間とリトライを大きくするほど、異常検出は遅くなる。求められる検出時間から逆算する。']},

 note:{title:'IO-Link のきほん',lines:['IO-Link は、センサやアクチュエータを IO-Link マスタにつなぐ通信。ポート1つに機器1台の「1対1」。','ケーブルは、ふつうのセンサと同じ3芯（M12 コネクタ、最長20m）。特別なケーブルはいらない。','ON/OFF だけでなく、測定値・パラメータ・診断情報をやりとりできる。ふつうの ON/OFF として使う「SIO モード」もある。','通信は3種類：サイクリック（プロセスデータ）、サービス（パラメータの読み書き）、イベント（機器からの異常通知）。','機器情報は IODD ファイル（XML）。マスタは EtherNet/IP・EtherCAT などで PLC とつながる。']},

 outro:[['tsunagi','h','センサがしゃべる世界へようこそ！まずはマスタのポート設定から。']]},

 note:{title:'プロセスデータとサイクルタイム',lines:['サイクリック通信では、プロセスデータ（測定値やスイッチ出力など）を決まった周期でやりとりする。','中身の並びは IODD の ProcessDataIn に書いてある。bitLength が全体の長さ、bitOffset が各データの開始ビット。32ビット＝4バイト。','サイクルタイムは、機器の minCycleTime（µs）より短くできない。多くのマスタは自動で合わせてくれる。','通信速度（COM1〜COM3）も、マスタが機器に合わせて自動で決める。','マスタが受け取ったプロセスデータは、上位の通信（EtherNet/IP など）で PLC の入力エリアに届く。']},

 note:{title:'ラダーの歩進制御',lines:['1つの工程に1つの工程リレー（M1・M2・M3）。「今の工程」かつ「完了条件」で、次の工程を SET、今の工程を RST。','保持の工程は、工程リレー M2 でタイマ T0 を動かし、タイムアップで次の工程へ。保持中の前進出力は、切っても入れたまま（押しつけ）でもよい。','3工程で9ラング。工程が20個なら60ラング以上。止まったときは、M1〜M3 を1つずつモニタで探すことになる。','さらに分岐（製品で工程を分ける、2つの作業を同時に進める）が入ると、枝どうしのインターロックや合流の条件が入り組んで、書いた本人でも追えなくなる。']},
 hints:['起動：X0, X2, !M1, !M3 → SET M1','前進端 X1 で M2 へ（SET M2・RST M1）。M2 → TON T0 K10、T0 で M3 へ','M3, X2 → RST M3。出力は M1 → Y0、M3 → Y1'],
 outro:[['rire','t','…できた！でも9ラング。工程が20個あったら、60ラング以上だよ〜。'],['rire','t','しかも、製品 A と B で工程を分けたり、2つの作業を同時に進めたりする「分岐」が入ると…工程リレーの条件がからまって、もう迷路。書いた本人でも読めなくなっちゃうの。'],['rire','h','しかも止まったら、M1〜M3 をひとつずつ見て回るの。これを図でスッキリさせるのが、SFC なんだ！']]},

function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

async function zip(u8,mode){const cs=mode==='c'?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw');const r=new Response(new Blob([u8]).stream().pipeThrough(cs));return new Uint8Array(await r.arrayBuffer());}

async function onUpload(file){const id=S.upId;if(!file||!id)return;

  const sc=Math.min(1,1100/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  let out=cv.toDataURL('image/webp',.9);if(!out.startsWith('data:image/webp'))out=cv.toDataURL('image/png');
  CUSTOM[id]=out;await IDB.put(id,out);goChars(true);}catch(e){notice('この画像は読み込めませんでした。PNGかJPEGを選んでください。');}}

 if(!S.res&&!S.man&&S.prog.length<s.max)h+=`<button class="rungadd" data-act="addr">＋ ラングを追加（残り ${s.max-S.prog.length}）</button>`;

 else h+=`<div class="ctrl"><button class="btn go" data-act="run">▶ テスト実行</button><button class="btn" data-act="manual">手で動かす</button>${s.init?'<button class="btn sm" data-act="initProg">最初の回路に戻す</button>':'<button class="btn sm" data-act="clearProg" aria-label="全消去">全消去</button>'}</div>`;

function devsOf(s){return [...new Set([...s.show,...s.watch])];}
function runAll(){const s=STAGES[S.si];const devs=devsOf(s);
 const pl=s.plant?PLANTS[s.plant]:null;const tests=s.tests.map(t=>{const act=runTest(S.prog,t,devs,pl);let first=null;
  for(const rf of [s.ref,...(s.altRefs||[])]){const exp=runTest(rf,t,devs,pl);const bad={};let pass=true;
  s.watch.forEach(d=>{bad[d]=s.verify==='seq'?compareSeq(exp.trace[d],act.trace[d],s.seqTol):s.verify==='blink'?verifyBlink(t,act.trace[d],'X0'):(s.verify==='alarm'&&d==='Y0')?verifyAlarm(t,act.trace[d]):compareTrace(exp.trace[d],act.trace[d]);if(t.skip)bad[d]=bad[d].filter(k=>!t.skip.some(([p,q])=>k>=p&&k<q));if(bad[d].length)pass=false;});
  if((s.plant==='cyl'||s.plant==='sol2')&&act.trace.Y0&&act.trace.Y1){const both=act.trace.Y0.findIndex((v,k)=>v&&act.trace.Y1[k]);if(both>=0){bad.Y0=[both];pass=false;}}
  const r={t,exp,act,bad,pass};if(pass)return r;if(!first)first=r;}
  return first;});
 const allPass=tests.every(x=>x.pass);if(!allPass)S.fails=(S.fails||0)+1;const sel=Math.max(0,tests.findIndex(x=>!x.pass));
 S.res={tests,sel,tick:0,allPass};renderPlay();playAnim(()=>{if(allPass)stageClear();else sfx('ng');});}
let animT=null;
function playAnim(done){clearInterval(animT);const R=S.res;const len=R.tests[R.sel].t.len;R.tick=0;updTick();
 animT=setInterval(()=>{R.tick++;if(R.tick>=len){R.tick=len-1;clearInterval(animT);animT=null;updTick();done&&done();return;}updTick();},70);}
function updTick(){const R=S.res;if(!R)return;const T=R.tests[R.sel];const f=T.act.frames[R.tick];
 const s=STAGES[S.si];$('#lad').innerHTML=ladderHTML(S.prog,{st:f.st,mem:f.mem,cmt:cmtOf()});
 $('#wave').innerHTML=waveSVG(s,T,R.tick);const sl=$('#scr');if(sl)sl.value=R.tick;$('#tk').textContent=(R.tick/10).toFixed(1)+'秒';
 $('#mon').textContent=monText(f.mem);const pv=$('#plantv');if(pv)pv.innerHTML=cylSVG(f.ps);}
function cylSVG(ps){if(!ps)return'';const p=ps.pos/6;return`<svg viewBox="0 0 220 46" class="cyl" aria-label="シリンダ位置 ${Math.round(p*100)}%"><rect x="6" y="8" width="80" height="24" rx="4" fill="#34466E"/><rect x="${14+p*60}" y="10" width="6" height="20" fill="#9FB0D6"/><rect x="${20+p*60}" y="17" width="66" height="6" fill="#C9D5F2"/><rect x="${86+p*60}" y="11" width="12" height="18" rx="2" fill="#F2A516"/><circle cx="12" cy="41" r="3.5" fill="${ps.pos<=0?'#46E6A2':'#34466E'}"/><text x="19" y="44" font-size="8" fill="#9FB0D6" font-family="DotGothic16,monospace">X2 後退端</text><circle cx="140" cy="41" r="3.5" fill="${ps.pos>=6?'#46E6A2':'#34466E'}"/><text x="147" y="44" font-size="8" fill="#9FB0D6" font-family="DotGothic16,monospace">X1 前進端</text></svg>`;}

function resultHTML(s){const R=S.res;const T=R.tests[R.sel];
 let h=`<div class="res"><div class="tabs">${R.tests.map((x,k)=>`<button class="tab ${k===R.sel?'a':''}" data-act="tsel" data-k="${k}">${x.pass?'<span class="ok">✓</span>':'<span class="ng">✗</span>'} ${esc(x.t.name)}</button>`).join('')}</div>

 <div class="legend"><span><i style="background:#46E6A2"></i>あなたの出力</span><span><i style="background:#F2A516"></i>正解の出力</span><span><i style="background:rgba(229,72,77,.6);height:10px"></i>ズレ</span></div>
 <div class="scrub"><input id="scr" type="range" min="0" max="${T.t.len-1}" value="${R.tick}" aria-label="時間"><span class="dot" id="tk">0.0秒</span></div>`;
 if(!R.allPass){const d=s.watch.find(d=>T.bad[d].length)||s.watch.find(d=>R.tests.some(x=>x.bad[d].length));const tk=(T.bad[d]||[0])[0];const f=CHARS[s.char].fail[(S.fails||0)%CHARS[s.char].fail.length];
  h+=`<div style="margin-top:10px">${sayHTML(s.char,f[0],f[1])}</div>`;if(T.pass){h+=`<p class="msg ng">このテストは合格。✗の付いたテストを選んで確認しよう。</p>`;}else h+=`<p class="msg ng">「${esc(T.t.name)}」の ${(tk/10).toFixed(1)}秒あたりで ${d} が期待と違います。スライダーでその時点の回路を確認しよう。</p>`;}
 else h+=`<p class="msg ok">すべてのテストに合格！</p>`;
 return h+`</div>`;}
function waveSVG(s,T,tick){const devs=devsOf(s);const len=T.t.len;const LW=40,st=11;const W=LW+len*st+6;let y=4;let g='';
 devs.forEach(d=>{const isD=d[0]==='D';const H=isD?38:28;const act=T.act.trace[d],exp=T.exp.trace[d];const watched=s.watch.includes(d)&&s.verify!=='blink'&&!(s.verify==='alarm'&&d==='Y0');
  g+=`<text x="4" y="${y+H/2+4}" font-family="DotGothic16,monospace" font-size="12" fill="#9FB0D6">${d}</text><path d="M${LW} ${y+H-2} H${W-4}" stroke="#2A3A60" stroke-width="1"/>`;
  (T.bad[d]||[]).forEach(t=>{g+=`<rect x="${LW+t*st}" y="${y}" width="${st}" height="${H}" fill="rgba(229,72,77,.45)"/>`;});
  const path=(arr,max)=>{let p='';arr.forEach((v,t)=>{const yy=isD?y+H-4-((v-mn)/(max-mn))*(H-10):(v?y+5:y+H-4);p+=(t?`L${LW+t*st} ${yy} `:`M${LW} ${yy} `)+`L${LW+(t+1)*st} ${yy} `;});return p;};
  const max=Math.max(1,...act,...exp);const mn=Math.min(0,...act,...exp);
  if(watched)g+=`<path d="${path(exp,max)}" stroke="#F2A516" stroke-width="2" fill="none" stroke-dasharray="4 3" opacity=".9"/>`;
  g+=`<path d="${path(act,max)}" stroke="#46E6A2" stroke-width="2.5" fill="none"/>`;
  if(isD){let last=null;act.forEach((v,t)=>{if(v!==last){g+=`<text x="${LW+t*st+2}" y="${y+10}" font-size="9" fill="#C9D5F2" font-family="DotGothic16,monospace">${v}</text>`;last=v;}});}
  y+=H+4;});
 g+=`<path d="M${LW+tick*st+st/2} 0 V${y}" stroke="#fff" stroke-width="1.5" opacity=".8"/>`;
 return`<svg width="${W}" height="${y}" viewBox="0 0 ${W} ${y}">${g}</svg>`;}

 return`<div class="bkbar" role="note"><p>iPhone・iPad の Safari では、7日ほど開かないと記録が消えることがあります。<b>ホーム画面に追加すれば、この心配はなくなります。</b></p><div class="bkb"><button class="btn sm go" data-act="install">ホーム画面に追加</button><button class="btn sm" data-act="bkHide">あとで</button></div></div>`;}

 if(INSTALL){const p=INSTALL;INSTALL=null;p.prompt();return;}
 if(IOS){migOpen();return;}
 notice('ブラウザのメニュー（︙ や …）から「アプリをインストール」または「ホーム画面に追加」を選んでください。ホーム画面から開くと、電波のない場所でも遊べます。');}
// iPhone・iPad：ホーム画面版は Safari と記録が別なので、コピー→貼りつけの2タップで移す
const hasRecord=()=>cleared()>0||Object.keys(SAVE.progs||{}).length>0||Object.keys(SAVE.sp||{}).length>0;
function migOpen(){const has=hasRecord();S.migCode=null;if(has)makeCode().then(c=>{S.migCode=c;const b=$('#migcopy');if(b)b.disabled=false;}).catch(()=>{});
 layer.innerHTML=`<div class="modal center" data-act="closeBg"><div class="card inst" role="dialog" aria-label="ホーム画面に追加"><h3>ホーム画面に追加</h3>
 <p class="cfn" style="margin:0 0 6px">ホーム画面から開くと、記録が消える心配がなくなり、電波のない場所でも遊べます。</p><ol class="mig">
 ${has?`<li><b>いまの記録をコピー</b><div class="migr"><button class="btn go sm" id="migcopy" data-act="migCopy" disabled>📋 記録をコピー</button><span class="migok" id="migok" hidden>✓ コピーしました</span></div><small>ホーム画面のラダ恋！は Safari と記録が別なので、先に写しておきます。</small></li>`:''}
 <li>共有ボタン（<b>□↑</b>）→「ホーム画面に追加」→「追加」</li>
 <li>ホーム画面の「ラダ恋！」から開く${has?'<small>タイトル画面の「Safari の記録を引き継ぐ」を押すと、コピーした記録が入ります。</small>':''}</li></ol>
 <button class="btn pk" data-act="close" style="width:100%;margin-top:12px">閉じる</button></div></div>`;}
function migCopy(){const c=S.migCode;if(!c)return;const m=$('#migok');
 const ok=()=>{if(m){m.hidden=false;m.textContent='✓ コピーしました';}};
 const ng=()=>{if(m){m.hidden=false;m.innerHTML='自動でコピーできませんでした。下のコードを長押しして「コピー」してください。<textarea readonly rows="3">'+esc(c)+'</textarea>';}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(ok,ng);return;}}catch(e){}ng();}
const migOffer=()=>IOS&&STANDALONE()&&!hasRecord();
async function migPaste(){let t='';try{if(navigator.clipboard&&navigator.clipboard.readText)t=await navigator.clipboard.readText();}catch(e){}
 const m=String(t||'').match(/LDK[12]\.[A-Za-z0-9_-]+/);
 if(m){try{const o=await readCode(m[0]);mergeSave(o);goTitle();notice(`Safari の記録を引き継ぎました（クリア ${cleared()} ステージ）。続きから遊べます。`);return;}catch(e){}}
 showXfer('Safari の「記録をコピー」で写したコードを、②の欄に長押しで貼りつけて「読み込む」を押してください。');}
function regSW(){if(!('serviceWorker' in navigator)||!window.isSecureContext||!/^https?:$/.test(location.protocol))return;const go=()=>setTimeout(()=>navigator.serviceWorker.register('sw.js').catch(()=>{}),1500);if(document.readyState==='complete')go();else window.addEventListener('load',go);}

// ---- クレジットと報告 ----
function goCredits(){stopAll();layer.innerHTML='';S.crFrom=S.scr==='settings'?'settings':null;S.scr='credits';bgm('night');
 const R=(h,...n)=>`<div class="cr-s"><h3>${h}</h3>${n.map(x=>`<p>${x}</p>`).join('')}</div>`;
 app.innerHTML=`<div class="hdr"><button class="ibtn" data-act="cfgBack" aria-label="戻る">←</button><h2>クレジット<small>ラダ恋！ PLCと通信の工場復旧ログ</small></h2></div><div class="sel"><div class="credits">
 ${typeof LOGO!=='undefined'?`<img class="cr-logo" src="${LOGO}" alt="ラダ恋！">`:'<h2>ラダ恋！</h2>'}<p class="cr-ver dot">ver ${VERSION}</p>
 ${R('制作','fulhause')}
 ${R('主題歌「ラダ恋！」','作詞　fulhause','作曲　Suno')}
 ${R('エンディングテーマ「END命令のあとで」','作詞　fulhause','作曲　Suno')}
 ${R('ゲーム内 BGM・効果音','ブラウザで合成するオリジナル音源')}
 ${R('スポンサー','<a href="https://www.gugen-inc.com/" target="_blank" rel="sponsored noopener">GUGEN</a>')}
 ${R('フォント','M PLUS Rounded 1c<br><small>© 2016 The Rounded M+ Project Authors</small>','DotGothic16<br><small>© 2020 The DotGothic16 Project Authors</small>','<small>どちらも <a href="https://openfontlicense.org/" target="_blank" rel="noopener">SIL Open Font License 1.1</a> で公開されています。</small>')}
 <div class="cr-cast"><div class="anim breath" style="--bd:1s">${portrait('kanade','h')}</div><div class="anim breath">${portrait('rire','w')}</div><div class="anim breath" style="--bd:2s">${portrait('tsunagi','h')}</div></div>
 <p class="cr-ty">Thank you for playing!</p>
 ${R('不具合・まちがいの報告','気づいたことがあれば、気軽に教えてください。','<span class="cfb cr-b"><button class="btn sm" data-act="report" data-v="x">X で報告</button><button class="btn sm" data-act="report" data-v="gh">GitHub で報告</button></span>')}
 <p class="cr-note">本作に登場する会社・人物・機種は架空のものです。メーカー名・規格名は、それぞれの権利者の商標または登録商標です。実際の設備の設計や作業は、各メーカーの取扱説明書と関連する規格に従ってください。</p>
 <p class="cr-c">© 2026 fulhause</p></div></div>`;window.scrollTo(0,0);}
function openReport(kind){const st=S.lastStage!=null?STAGES[S.lastStage]:null;const ua=navigator.userAgent;
 const dev=/iPhone/.test(ua)?'iPhone':(/iPad/.test(ua)||IOS)?'iPad':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'その他';
 const br=/Edg/.test(ua)?'Edge':/CriOS|Chrome/.test(ua)?'Chrome':/FxiOS|Firefox/.test(ua)?'Firefox':/Safari/.test(ua)?'Safari':'その他';
 const where=[`ver ${VERSION}`,st?`STAGE ${stageNo(S.lastStage)}「${st.title}」`:'',`${dev}・${br}${STANDALONE()?'（ホーム画面）':''}`].filter(Boolean).join('／');
 const url=kind==='gh'?'https://github.com/fulhause/ladakoi/issues/new?title='+encodeURIComponent('[報告] ')+'&body='+encodeURIComponent(`### どんなことが起きましたか？\n\n（ここに書いてください。まちがいの報告なら、どこがどう違うかも書いてもらえると助かります）\n\n### 環境\n${where}\n`)
  :'https://x.com/intent/post?text='+encodeURIComponent(`@fulhause #ラダ恋 不具合・まちがいの報告\n\n（ここに内容を書いてください）\n\n${where}`);
 window.open(url,'_blank','noopener');}

// ---------- events ----------
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;const s=STAGES[S.si];
 if(a==='pickBg'&&e.target!==el)return; if(a==='closeBg'&&e.target!==el)return;
 sfxAct(a,el);
 switch(a){
 case'toSelect':if(S.scr==='title'&&PREF.snd==null){askSound(()=>{backTo=goSelect;goSelect();});break;}backTo=goSelect;goSelect();break;
 case'toSettings':if(S.scr!=='settings'&&S.scr!=='credits')S.cfgBack=S.scr==='select'?goSelect:goTitle;goSettings();break;
 case'toCredits':if(S.scr!=='settings'&&S.scr!=='credits')S.cfgBack=S.scr==='select'?goSelect:goTitle;goCredits();break;
 case'cfgBack':(S.scr==='credits'&&S.crFrom==='settings'?goSettings:(S.cfgBack||goTitle))();break;
 case'cfgset':cfgSet(el.dataset.k,el.dataset.v);break;
 case'sndAns':sndAnswer(el.dataset.v==='1');break;
 case'advAuto':{e.stopPropagation();PREF.auto=!PREF.auto;saveCfg();el.classList.toggle('on',PREF.auto);el.setAttribute('aria-pressed',PREF.auto);if(ADV){if(PREF.auto&&!ADV.typing)advAuto(900);else clearTimeout(ADV.autoT);}break;}
 case'bkSave':bkSave();break;
 case'bkLoad':$('#bkf').click();break;
 case'migCopy':migCopy();break;
 case'migPaste':migPaste();break;
 case'bkHide':PREF.bkHide=Date.now();saveCfg();{const b=$('.bkbar');if(b)b.remove();}break;
 case'install':doInstall();break;
 case'report':openReport(el.dataset.v);break;
 case'endCredits':layer.innerHTML='';S.scr='end';S.cfgBack=goTitle;goCredits();break;
 case'toTitle':backTo=goTitle;goTitle();break;
 case'toChars':backTo=S.scr==='select'?goSelect:goTitle;goChars();break;
 case'unlockAll':ask(`確認用に全${STAGES.length}ステージをクリア済みにします。特別エピソードと全クリア記念エピソードもすべて見られるようになります。（「記録を消す」で元に戻せます）`,'全解放する',()=>{STAGES.forEach((s,k)=>SAVE.clear[sid(k)]=1);persist();layer.innerHTML='';backTo=goSelect;goSelect();});break;
 case'gal':S.gal=S.gal||{};S.gal[el.dataset.id]=el.dataset.v;goChars(true);break;
 case'ep':{const id=el.dataset.id;if(SAVE.clear[FINAL[id]])playSpecial(FIDX(id),()=>goChars());break;}
 case'upl':S.upId=el.dataset.id;$('#upf').click();break;
 case'unupl':{const id=el.dataset.id;delete CUSTOM[id];IDB.put(id,null);goChars(true);break;}
 case'advLog':e.stopPropagation();advLog();break;
 case'advHide':e.stopPropagation();$('.talk').classList.add('hideui');break;
 case'cgview':{const id=el.dataset.id;if(!SAVE.cg[id])break;const t=(albumList().find(a=>a.cg===id)||{title:''}).title;layer.innerHTML=`<div class="cgv" data-act="close" role="dialog" aria-label="${esc(t)}"><img src="${CGS[id]}" alt=""><p>${esc(t)}　タップで閉じる</p></div>`;break;}
 case'finale':playFinale(goSelect);break;
 case'bfin':playBonusFin(goSelect);break;
 case'ufin':playUaFin(goSelect);break;
 case'xfin':{const f=EXFINS.find(f=>f.n==el.dataset.n);if(f)playExFin(f,goSelect);break;}
 case'endFinale':layer.innerHTML='';playFinale(goSelect);break;
 case'advLogClose':$('#talkov').innerHTML='';break;
 case'cheer':{const cl=cheerOf(s);S.ch=((S.ch==null?-1:S.ch)+1)%cl.length;const q=cl[S.ch];$('#cheer').innerHTML=`<div class="cheer">${sayHTML(s.char,q[0],q[1])}</div>`;clearTimeout(S.cht);S.cht=setTimeout(()=>{const x=$('#cheer');if(x)x.innerHTML='';},7000);break;}
 case'back':backTo();break;
 case'xfer':showXfer();break;
 case'xferMake':xferMake();break;
 case'xferCopy':xferCopy();break;
 case'xferLoad':xferLoad();break;
 case'reset':ask('クリア記録・保存した回路・既読・アルバムをすべて消します。よろしいですか？','記録を消す',()=>{SAVE={clear:{},best:{},progs:{},seen:{},cg:{},sp:{},v:3};persist();goTitle();},true);break;
 case'stage':{const i=+el.dataset.i;if(unlocked(i))startStage(i);break;}
 case'advTap':advTap();break;
 case'advNext':e.stopPropagation();$('#talkov').innerHTML='';ADV.i++;advShow();break;
 case'advSkip':e.stopPropagation();advFinish();break;
 case'note':showNote();break;
 case'hint':showHint();break;
 case'hintMore':S.hint++;showHint();break;
 case'answer':ask(s.mode==='ladder'?'正解の回路を表示しますか？ 今の回路は正解の回路に置き換わります。（正解を見てクリアした場合、★省素子は付きません）':'正解を表示しますか？','正解を見る',applyAnswer);break;
 case'close':case'closeBg':layer.innerHTML='';break;
 case'cell':openPick(+el.dataset.r,el.dataset.k);break;
 case'pickBg':S.pick=null;layer.innerHTML='';break;
 case'pt':{const P=S.pick;const t=el.dataset.v;const o=P.d||{};
  if(t==='CMP')P.d={t,a:(s.pal.cmpd||[])[0],op:'>=',k:o.k!=null&&o.t==='CMP'?o.k:0};
  else if(!P.isOut){const list=t==='P'?s.pal.cdev.filter(x=>x[0]==='X'):s.pal.cdev;P.d={t,d:o.d&&list.includes(o.d)?o.d:(list.length===1?list[0]:null)};}
  else{const ds=outDevs(s,t);P.d={t,d:o.d&&ds.includes(o.d)?o.d:(ds.length===1?ds[0]:null)};if(['TON','CTU','MOV','ADD','SUB','MUL','DIV'].includes(t))P.d.k=o.k!=null?o.k:({TON:10,CTU:3,MUL:1,DIV:1}[t]||0);}
  renderPick();break;}
 case'pd':S.pick.d.d=el.dataset.v;renderPick();break;
 case'psrc':{const v=el.dataset.v;if(v){S.pick.d.s=v;}else{delete S.pick.d.s;if(S.pick.d.k==null||isNaN(S.pick.d.k))S.pick.d.k=0;}renderPick();break;}
 case'pa':S.pick.d.a=el.dataset.v;renderPick();break;
 case'po':S.pick.d.op=el.dataset.v;renderPick();break;
 case'pok':if(pickValid())applyPick(S.pick.d);break;
 case'pdel':applyPick(null);break;
 case'addr':S.prog.push(emptyRung());saveProg();renderPlay();break;
 case'delr':S.prog.splice(+el.dataset.r,1);if(!S.prog.length)S.prog.push(emptyRung());saveProg();renderPlay();break;
 case'br':S.prog[+el.dataset.r].span=1;saveProg();renderPlay();break;
 case'unbr':{const r=S.prog[+el.dataset.r];r.span=0;r.b=[null,null,null,null];saveProg();renderPlay();break;}
 case'span':{const r=S.prog[+el.dataset.r];r.span=Math.max(1,Math.min(3,r.span+ +el.dataset.v));for(let k=r.span;k<4;k++)r.b[k]=null;saveProg();renderPlay();break;}
 case'clearProg':ask('この回路をすべて消しますか？','全消去',()=>{layer.innerHTML='';S.prog=[emptyRung()];saveProg();renderPlay();},true);break;
 case'run':stopAll();runAll();break;
 case'manual':stopAll();S.res=null;startManual();break;
 case'edit':stopAll();S.res=null;renderPlay();break;
 case'replay':playAnim();break;
 case'tsel':clearInterval(animT);S.res.sel=+el.dataset.k;S.res.tick=0;renderPlay();updTick();break;
 case'pb':{const d=el.dataset.d;S.man.inp[d]=S.man.inp[d]?0:1;el.classList.toggle('on',!!S.man.inp[d]);el.setAttribute('aria-pressed',!!S.man.inp[d]);break;}
 case'ftok':{const F=S.fr;const k=+el.dataset.k;const j=F.fill.indexOf(null);if(j<0)break;F.fill[j]=k;F.bad=null;F.sent=0;renderPlay();break;}
 case'fslot':{const F=S.fr;F.fill[+el.dataset.k]=null;F.bad=null;F.sent=0;renderPlay();break;}
 case'fclr':S.fr.fill=S.fr.fill.map(()=>null);S.fr.bad=null;renderPlay();break;
 case'fsend':{const F=S.fr;const got=F.fill.map(k=>s.tokens[k][1]);const bad=[];got.forEach((b,k)=>{if(b!==s.answer[k])bad.push(k);});F.bad=bad;F.sent=1;renderPlay();if(!bad.length)setTimeout(stageClear,1000);else sfx('ng');break;}
 case'hk':hexKey(el.dataset.v);break;
 case'hbs':{const X=S.hx;X.bad=null;if(X.nib)X.nib='';else{const b=X.bytes.pop();if(b)X.nib=b[0];}renderPlay();break;}
 case'hclr':S.hx={bytes:[],nib:'',bad:null};renderPlay();break;
 case'hcrc':{const X=S.hx;X.nib='';const c=crc16(X.bytes.map(b=>parseInt(b,16)));X.bytes.push(hx(c[0]),hx(c[1]));X.bad=null;renderPlay();break;}
 case'hsend':{const X=S.hx;const bad=[];s.answer.forEach((b,k)=>{if(X.bytes[k]!==b)bad.push(k);});X.bad=bad;renderPlay();if(!bad.length)setTimeout(stageClear,400);else sfx('ng');break;}
 case'qch':{S.dc.ans[+el.dataset.q]=el.dataset.v;renderPlay();break;}
 case'dchk':{const D=S.dc;D.mark=s.qs.map((q,k)=>{const a=String(D.ans[k]==null?'':D.ans[k]).trim().replace(/\s/g,'');if(!a)return false;const ty=q[2]||'dec';
   if(ty==='hex'){const x=a.replace(/^0x/i,'').replace(/h$/i,'');return /^[0-9a-f]+$/i.test(x)&&parseInt(x,16)===q[1];}
   if(ty==='bin')return a===q[1];return +a===q[1];});renderPlay();if(!D.mark.includes(false))setTimeout(stageClear,400);else sfx('ng');break;}
 case'next':goNext();break;
 case'cfv':{if(S.cf.busy)break;S.cf.v[el.dataset.k]=el.dataset.v;S.cf.log=null;S.cf.err=null;const y=window.scrollY;renderPlay();window.scrollTo(0,y);break;}
 case'cftest':if(!S.cf.busy)runCfgTest();break;
 case'cfreset':if(!S.cf.busy){S.cf.v=Object.assign({},s.init);S.cf.log=null;S.cf.err=null;renderPlay();}break;
 case'cmtT':SAVE.cmtOff=!SAVE.cmtOff;persist();renderPlay();if(S.res)updTick();break;

 case'zoomClose':e.stopPropagation();if(Date.now()-zoomAt<450)break;zoomEl.innerHTML='';break;
 case'initProg':ask('バグ入りの最初の回路に戻しますか？','戻す',()=>{layer.innerHTML='';S.prog=cloneProg(s.init);saveProg();renderPlay();},true);break;
 case'toNotes':backTo=S.scr==='select'?goSelect:goTitle;goNotes();break;
 case'nbk':{const x=STAGES[+el.dataset.i];layer.innerHTML=`<div class="modal center" data-act="closeBg">${noteCard(x.note,'閉じる','close')}</div>`;break;}
 case'toGloss':backTo=S.scr==='select'?goSelect:goTitle;goGloss();break;
 case'askYes':{const f=ASK;ASK=null;f&&f();break;}
 case'askNo':if(a==='askNo'&&e.target!==el&&el.classList.contains('modal'))break;ASK=null;layer.innerHTML='';break;
 case'sp':{const i=+el.dataset.i;if(SAVE.clear[sid(i)])playSpecial(i,goSelect);break;}
 case'spnow':S.lastClear.first=false;playSpecial(S.si,()=>{renderClear();});break;
 case'endOk':layer.innerHTML='';goTitle();break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='upf'){onUpload(e.target.files[0]);e.target.value='';}
 if(e.target.id==='bkf'){bkLoad(e.target.files[0]);e.target.value='';}
 if(e.target.dataset&&e.target.dataset.cfg==='se')sfx('relay');});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.cfg){const k=t.dataset.cfg;PREF[k]=(+t.value)/100;saveCfg();sndVol();const o=$('#v_'+k);if(o)o.textContent=t.value;return;}
 if(t.id==='pk'&&S.pick){S.pick.d.k=t.value===''?NaN:Math.max(0,Math.min(32767,parseInt(t.value,10)));const sp=$('#pks');if(sp)sp.textContent='= '+((S.pick.d.k||0)/10).toFixed(1)+'秒';
  const ok=pickValid();const b=document.querySelector('[data-act="pok"]');if(b)b.disabled=!ok;const pv=document.querySelector('.prev');if(pv)pv.innerHTML=ok?(S.pick.isOut?symOut(S.pick.d,false):symCell(S.pick.d,false)):'<span class="dot" style="color:#6F81AA">未完成</span>';}
 if(t.id==='scr'&&S.res){clearInterval(animT);S.res.tick=+t.value;updTick();}
 if(t.dataset.dr&&S.man){S.man.inp[t.dataset.dr]=+t.value;$('#dv_'+t.dataset.dr).textContent=t.value;}
 if(t.dataset.q!=null&&S.dc){S.dc.ans[+t.dataset.q]=t.value;}
});
regSW();
if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{S.persisted=p;}).catch(()=>{});
goTitle();
IDB.all().then(m=>{CUSTOM=m||{};if(Object.keys(CUSTOM).length&&S.scr==='title')goTitle();});
